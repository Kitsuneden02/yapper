<!doctype html>
<!-- Abre el editor con dev/demo.webm cargado, para revisar el diseño (también con Edge/Chrome headless).
     Fragmentos: #create (crea un sticker), #lib (pestaña Biblioteca), #settings (diálogo de ajustes). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<iframe id="f" src="../editor/editor.html"></iframe>
<script type="module">
const f = document.getElementById("f");
await new Promise((r) => f.addEventListener("load", r, { once: true }));
const w = f.contentWindow;
const d = f.contentDocument;
const blob = await (await fetch("demo.webm")).blob();
const dt = new w.DataTransfer();
dt.items.add(new w.File([blob], "demo.webm", { type: "video/webm" }));
w.dispatchEvent(new w.DragEvent("drop", { dataTransfer: dt, cancelable: true }));
await new Promise((r) => setTimeout(r, 1500));
if (location.hash.includes("create")) {
  d.getElementById("btnCreate").click();
  await new Promise((r) => { const id = setInterval(() => { if (!d.getElementById("result").hidden) { clearInterval(id); r(); } }, 200); });
}
if (location.hash.includes("lib")) d.querySelector('[data-tab="lib"]').click();
if (location.hash.includes("settings")) { d.getElementById("btnSettings").click(); d.querySelector(".calib").open = true; }
await new Promise((r) => setTimeout(r, 800));
document.title = "ready";
</script>
</body></html>
